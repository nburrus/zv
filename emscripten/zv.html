<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>zv</title>
    <style>
      body {
        font-family: arial;
        margin: 0;
        padding: none;
      }
      .emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
      div.emscripten { text-align: center; }
      div.emscripten_border { border: none; }
      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten { border: 0px none; background-color: black; }
    </style>
  </head>
  <body>

    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <script type='text/javascript'>
      var Module = {
        preRun: [],
        postRun: [],
        // print: (function() {})(),
        // printErr: function(text) {},
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          // As a default initial behavior, pop up an alert when webgl context is lost. To make your
          // application robust, you may want to override this behavior before shipping!
          // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
          canvas.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);
          return canvas;
        })(),
        setStatus: function(text) {},
        totalDependencies: 0,
        monitorRunDependencies: function(left) {}
      };

      // Clipboard functions for web
      function js_copyTextToClipboard(text) {
        return navigator.clipboard.writeText(text);
      }

      function js_copyImageToClipboard(canvas) {
        return new Promise((resolve, reject) => {
          canvas.toBlob(blob => {
            const item = new ClipboardItem({ 'image/png': blob });
            navigator.clipboard.write([item])
              .then(resolve)
              .catch(reject);
          }, 'image/png');
        });
      }

      function js_pasteFromClipboard() {
        // Check if we're in a secure context
        if (!window.isSecureContext) {
          console.warn('Clipboard access requires a secure context (HTTPS or localhost)');
          return null;
        }

        // Check if clipboard API is available
        if (!navigator.clipboard || !navigator.clipboard.read) {
          console.warn('Clipboard API not available');
          return null;
        }

        // Create a canvas to return
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        // Return a promise that resolves with the canvas once the image is loaded
        return new Promise((resolve, reject) => {
            navigator.clipboard.read()
                .then(function(items) {
                    for (const item of items) {
                        if (item.types.includes('image/png')) {
                            item.getType('image/png')
                                .then(function(blob) {
                                    const img = new Image();
                                    img.onload = function() {
                                        canvas.width = img.width;
                                        canvas.height = img.height;
                                        ctx.drawImage(img, 0, 0);
                                        console.log("js_pasteFromClipboard: Resolved with canvas");
                                        resolve(canvas);
                                    };
                                    img.onerror = function() {
                                        reject(new Error('Failed to load image'));
                                    };
                                    img.src = URL.createObjectURL(blob);
                                })
                                .catch(reject);
                            return;
                        }
                    }
                    reject(new Error('No image found in clipboard'));
                })
                .catch(function(err) {
                    console.warn('Clipboard read failed:', err);
                    if (err.name === 'NotAllowedError') {
                        console.warn('Clipboard permission denied. Please ensure the page is served over HTTPS or localhost and the operation is triggered by a user gesture.');
                    }
                    reject(err);
                });
        });
      }

      window.addEventListener('resize', js_resizeCanvasToFitWindow, false);
      function js_resizeCanvasToFitWindow() {
            console.log("js_resizeCanvasToFitWindow");
            var canvas = document.getElementById('canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // NOT calling the C++ function to notify about the resize, we monitor
            // it by directly checking the canvas width/height on each frame.
            // if (Module.calledRun) { // Ensure the C++ runtime is ready
            //     Module._zv_resizeCanvas(canvas.width, canvas.height);
            // }
      }

    </script>
    <script async type="text/javascript" src="zv.js"></script>
  </body>
</html>
