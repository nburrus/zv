[package]
name = "zv-viewer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.33", features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui = "0.33"
egui_extras = "0.33"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "pnm", "tga", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
